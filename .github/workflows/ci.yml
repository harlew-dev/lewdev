name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, lint, typecheck and test
        run: bun run check

      - name: Build standalone binary
        run: bun run build

      - name: Smoke test standalone binary in isolation
        shell: bash
        run: |
          set -euo pipefail
          if [ -f dist/lewdev.exe ]; then
            binary=dist/lewdev.exe
          else
            binary=dist/lewdev
          fi
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cp "$binary" "$work/"
          cd "$work"
          "./$(basename "$binary")" --version
          "./$(basename "$binary")" --help > /dev/null
          bun -e '
            let output = "";
            let started = false;
            const child = Bun.spawn([process.argv[1]], {
              env: { ...process.env, XDG_CONFIG_HOME: process.cwd(), SB_API_URL: "", SB_API_TOKEN: "" },
              terminal: {
                cols: 100,
                rows: 30,
                data(_, bytes) {
                  output += Buffer.from(bytes).toString();
                  if (!started && Bun.stripANSI(output).includes("AerolVM")) {
                    started = true;
                    child.kill();
                  }
                },
              },
            });
            const timeout = setTimeout(() => child.kill(), 10_000);
            await child.exited;
            clearTimeout(timeout);
            child.terminal?.close();
            if (!started) throw new Error("Connect screen did not render: " + Bun.stripANSI(output));
          ' "./$(basename "$binary")"
